name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package artifacts
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

  # Step 1: Dev runs right after Build
  dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging / TestPyPI
        run: echo "Deploying to TestPyPI..."

  # Step 2: Test runs after Dev completes
  test:
    needs: dev
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies & run pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pytest

  # Step 3: Prod runs last after Test passes
  prod:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to PyPI Production
        run: echo "Deploying to production PyPI..."