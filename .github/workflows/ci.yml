name: Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Stage 1: Test (Runs on every PR and push)
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies & run tests
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pytest

  # Stage 2: Staging / TestPyPI (Runs only on 'develop' after tests pass)
  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publish to TestPyPI
        # Add your build/publish steps here using trusted publishing or tokens
        run: echo "Publishing to TestPyPI (Staging)..."

  # Stage 3: Production PyPI (Runs only when a GitHub Release is published)
  deploy-production:
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publish to official PyPI
        run: echo "Publishing to production PyPI..."