[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restpulse"
version = "5.0.0"
description = "A lightweight, asynchronous Python REST API client for fetching, validating, and structuring web data."
readme = "README.md"
authors = [
    { name = "Himashi" }
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
]